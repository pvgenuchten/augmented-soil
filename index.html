<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display a popup on click</title>
    <meta property="og:description" content="When a user clicks a symbol, show a popup containing more information." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<style>
    .maplibregl-popup {
        max-width: 400px;
        font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
    }
</style>
<div id="map"></div>
<script src="https://loc8.us/maplibre-gl-vector-text-protocol/dist/maplibre-gl-vector-text-protocol.js"></script>


<script>
    maplibregl.addProtocol('csv', VectorTextProtocol.VectorTextProtocol);
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://api.maptiler.com/maps/landscape/style.json?key=yH0OYyck18AvMLwBFidR',
        center: [0, 50],
        zoom: 5
    });

    map.on('load', () => {

 // CSV
  const csvSourceName = 'ISIS - Soils Collection';
  const csvLink = 'csv://./isis.csv';
  map.addSource(csvSourceName, {
    'type': 'geojson',
    'data': csvLink,
  });
  map.addLayer({
    'id': csvSourceName,
    'type': 'circle',
    'source': csvSourceName,
    'minzoom': 0,
    'maxzoom': 20,
    'paint': {
      'circle-color': 'yellow',
      'circle-stroke-color': 'black',
      'circle-stroke-width': 2,
      'circle-radius': 12,
      'circle-stroke-color': 'black'
    }
  });

        // When a click event occurs on a feature in the places layer, open a popup at the
        // location of the feature, with description HTML from its properties.
        map.on('click', csvSourceName, (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const description = "Profile: <a target=_blank href='https://isis.isric.org/monoliths/reference-soil-"+e.features[0].properties.profile_code+"'>"+e.features[0].properties.profile_code+"</a><br/>Soil class: "+e.features[0].properties.classification;

            // Ensure that if the map is zoomed out such that multiple
            // copies of the feature are visible, the popup appears
            // over the copy being pointed to.
            while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
            }

            new maplibregl.Popup()
                .setLngLat(coordinates)
                .setHTML(description)
                .addTo(map);
        });

        // Change the cursor to a pointer when the mouse is over the places layer.
        map.on('mouseenter', csvSourceName, () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        // Change it back to a pointer when it leaves.
        map.on('mouseleave', csvSourceName, () => {
            map.getCanvas().style.cursor = '';
        });
    });
</script>
</body>
</html>
