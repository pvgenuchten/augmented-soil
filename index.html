<!DOCTYPE html>
<html lang="en">
<head>
    <title>Access ISIS soil collection from map</title>
    <meta property="og:description" content="Map shows the location of reference soils of ISIS Soil Collection" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<style>
    .maplibregl-popup {
        max-width: 400px;
        font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
    }
</style>
<div id="map"></div>
<script src="https://loc8.us/maplibre-gl-vector-text-protocol/dist/maplibre-gl-vector-text-protocol.js"></script>


<script>

    inMuseum = "NL049,NL052,NL059,NL006,NL030,NL014,NL013,NL011,NL001,NL005,NL016,NL029,NL021,BR012,NL039,NL042,NL042,NL037,NL058,GL001,GL006,GL003,ZA016,CN040,CU016,CN039,GM045,SE017,FR011,IT018,GR003,ZA011,CU015,CN014,US014,IN011,US011,NG008,BR026,BR007,EC004,IN009,PE06,ID047,PE005,BR029,UY001,RO007,FI06,DE006,PE018,NO001,ID016,JO001,ES011,DE010,NA001,NA009,IT011,IC001,EC002,ID029,JM007,PH004,DE014,KE017,IN005,CN026,WS003,ES012,NL020,NL041,NL043,TH001,JP001,CN003,ES999,ZM001,ZM010,ID039,BR013,FI003"

    maplibregl.addProtocol('csv', VectorTextProtocol.VectorTextProtocol);
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://api.maptiler.com/maps/landscape/style.json?key=yH0OYyck18AvMLwBFidR',
        center: [0, 50],
        pitch: 60,
        zoom: 5
    });

    map.on('load', () => {

 // CSV
  const csvSourceName = 'ISIS - Soils Collection';
  const csvLink = 'csv://./isis.csv';
  map.addSource(csvSourceName, {
    'type': 'geojson',
    'data': csvLink,
  });
  map.addLayer({
    'id': csvSourceName,
    'type': 'circle',
    'source': csvSourceName,
    'minzoom': 0,
    'maxzoom': 20,
    'paint': {
      'circle-color': 'yellow',
      'circle-stroke-color': 'black',
      'circle-stroke-width': 2,
      'circle-radius': 12,
      'circle-stroke-color': 'black'
    }
  });

        // When a click event occurs on a feature in the places layer, open a popup at the
        // location of the feature, with description HTML from its properties.
        map.on('click', csvSourceName, (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const description = "Profile: <a href='https://isis.isric.org/monoliths/reference-soil-"+e.features[0].properties.profile_code+"'>"+
                e.features[0].properties.profile_code+"</a><br/>Soil class: <a href='https://www.isric.org/explore/world-soil-distribution/"+
                e.features[0].properties.classification.toLowerCase()+"s'>"+e.features[0].properties.classification+"</a><br/>Storage: "+
                (inMuseum.indexOf(e.features[0].properties.profile_code)>-1?"Museum":"Storage")+"<br/><br/><img src='https://www.isric.org/isric/webdocs/images/webpics/isric_"+e.features[0].properties.img+".jpg' style='width:120px'>";

            // Ensure that if the map is zoomed out such that multiple
            // copies of the feature are visible, the popup appears
            // over the copy being pointed to.
            while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
            }

            new maplibregl.Popup()
                .setLngLat(coordinates)
                .setHTML(description)
                .addTo(map);
        });

        // Change the cursor to a pointer when the mouse is over the places layer.
        map.on('mouseenter', csvSourceName, () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        // Change it back to a pointer when it leaves.
        map.on('mouseleave', csvSourceName, () => {
            map.getCanvas().style.cursor = '';
        });
    });
</script>
</body>
</html>
